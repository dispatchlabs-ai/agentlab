[package]
name = "agentlab"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
description = "Content-addressed workspace snapshots and isolated agent execution"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6.0"
libc = "0.2"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
similar = "2.7"
tar = "0.4"
tempfile = "3.20"
toml = "0.8"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
